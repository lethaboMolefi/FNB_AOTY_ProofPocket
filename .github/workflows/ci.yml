name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: system

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: proofpocket_owner
          POSTGRES_PASSWORD: owner_dev_password
          POSTGRES_DB: proofpocket
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U proofpocket_owner -d proofpocket"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: system/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: system/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Create database roles (as docker-compose does locally)
        run: PGPASSWORD=owner_dev_password psql -h localhost -p 5433 -U proofpocket_owner -d proofpocket -f apps/api/db-init/01-roles.sql
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit and API tests
        run: pnpm test
      - name: Dependency audit
        run: pnpm audit --audit-level high --prod
      - name: End-to-end (phone and desktop)
        run: |
          key() { node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"; }
          sed -e "s|^ACCOUNT_NUMBER_KEY=.*|ACCOUNT_NUMBER_KEY=$(key)|" -e "s|^OTP_SECRET=.*|OTP_SECRET=$(key)|" apps/api/.env.example > apps/api/.env
          cp apps/web/.env.example apps/web/.env
          pnpm --filter @proofpocket/web exec playwright install --with-deps chromium
          pnpm test:e2e
        env:
          CI: "true"

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.182.1
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The helmet_header_* rules are informational ("this header is set"), so they're excluded.
      - run: >-
          semgrep scan --config p/default --config p/typescript --config p/nodejsscan --error
          --exclude v2 --exclude "*.test.ts"
          --exclude-rule ajinabraham.njsscan.good.good_helmet_checks.helmet_header_x_powered_by
          --exclude-rule ajinabraham.njsscan.good.good_helmet_checks.helmet_header_dns_prefetch
          --exclude-rule ajinabraham.njsscan.good.good_helmet_checks.helmet_header_hsts
          --exclude-rule ajinabraham.njsscan.good.good_helmet_checks.helmet_header_ienoopen
          --exclude-rule ajinabraham.njsscan.good.good_helmet_checks.helmet_header_nosniff
          --exclude-rule ajinabraham.njsscan.good.good_helmet_checks.helmet_header_xss_filter

  gitleaks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
